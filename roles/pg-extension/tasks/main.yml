---
# tasks file for roles/pg-ext
- name: Fetch system code
  shell: "lsb_release -c -s"
  register: _lsb_release_code
  failed_when: _lsb_release_code.rc != 0 or _lsb_release_code.stdout == ""

- name: Install pigsty pgsql apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgsql.list
    content: |
      deb [trusted=yes] https://repo.pigsty.io/apt/pgsql/{{ _lsb_release_code.stdout }} {{ _lsb_release_code.stdout }} main
    mode: "0644"

- name: Add PGDG apt key and source (for pgvector and other PGDG-only extensions)
  ansible.builtin.shell: |
    install -d /usr/share/postgresql-common/pgdg
    curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
  args:
    executable: /bin/bash
    creates: /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc

- name: Add PGDG apt source
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/pgdg.list
    content: |
      deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] https://apt.postgresql.org/pub/repos/apt {{ _lsb_release_code.stdout }}-pgdg main
    mode: "0644"

- name: Update apt cache
  apt:
    update_cache: yes
  register: _apt_update
  ignore_errors: true
  tags: [repo]

- name: Check if pig is installed
  command: which pig
  register: _pig_check
  changed_when: false
  failed_when: false

- name: Install pig tool
  vars:
    _pkg_url: "{{ pig_tool }}"
  apt:
    deb: "{{ _pkg_url }}"
  when: _pig_check.rc != 0

- name: Install postgresql extensions
  shell: |
    pig install "{{ item }}" -v {{ postgres_version }} -y
  args:
    executable: /bin/bash
  loop: "{{ pg_extensions }}"
  register: _install_ext
  when: item is defined and item != ""
  failed_when: _install_ext.rc != 0

- name: Install python3-psycopg2 for community.postgresql modules
  ansible.builtin.apt:
    name: python3-psycopg2
    state: present
  when: pg_create_extensions or pg_create_extensions == 'true'
  tags: [create]

- block:
  - name: Check if this node is PostgreSQL primary
    community.postgresql.postgresql_query:
      db: postgres
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"
      query: "SELECT pg_is_in_recovery();"
    register: is_recovery

  - name: Install PostgreSQL extensions on primary node only
    community.postgresql.postgresql_query:
      db: "{{ item.db }}"
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"
      query: "CREATE EXTENSION IF NOT EXISTS \"{{ item.extension }}\" {{ 'CASCADE' if item.cascade | default(false) else '' }};"
    loop: "{{ pg_extensions_on }}"
    when: not is_recovery.query_result[0]['pg_is_in_recovery']
  when: pg_create_extensions or pg_create_extensions == 'true'
  tags: [create]

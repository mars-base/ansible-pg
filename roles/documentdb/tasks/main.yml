---
# tasks file for roles/documentdb
# Grant documentdb extension privileges to a non-postgres role
# Condition: documentdb in pg_extensions AND documentdb_postgres_role is defined

- name: Select the primary node by patroni api
  uri:
    url: "http://{{ ansible_default_ipv4.address }}:8008/"
    method: GET
    return_content: true
    status_code: 200
    body_format: json
  register: _patroni_primary
  changed_when: true
  failed_when: false

- block:

  - name: Grant DocumentDB schema USAGE to documentdb role
    community.postgresql.postgresql_privs:
      login_db: postgres
      state: present
      privs: USAGE
      type: schema
      objs: "{{ item }}"
      roles: "{{ documentdb_postgres_role }}"
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"
    loop:
      - documentdb_api
      - documentdb_api_catalog
      - documentdb_api_internal
      - documentdb_api_internal_admin
      - documentdb_api_internal_bgworker
      - documentdb_api_internal_readonly
      - documentdb_api_internal_readwrite
      - documentdb_api_v2
      - documentdb_core
      - documentdb_data

  - name: Grant DocumentDB roles to documentdb role
    community.postgresql.postgresql_membership:
      group: "{{ item }}"
      target_roles:
        - "{{ documentdb_postgres_role }}"
      state: present
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"
      login_db: postgres
    loop:
      - documentdb_admin_role
      - documentdb_api_find_role
      - documentdb_api_insert_role
      - documentdb_api_update_role
      - documentdb_api_remove_role

  - name: Grant documentdb role ALL on documentdb_api_catalog tables and sequences
    community.postgresql.postgresql_privs:
      login_db: postgres
      state: present
      privs: ALL
      type: "{{ item.type }}"
      objs: ALL_IN_SCHEMA
      schema: documentdb_api_catalog
      roles: "{{ documentdb_postgres_role }}"
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"
    loop:
      - { type: table }
      - { type: sequence }

  - name: Grant documentdb role ALL on documentdb_data schema (for dynamic table creation)
    community.postgresql.postgresql_privs:
      login_db: postgres
      state: present
      privs: ALL
      type: schema
      objs: documentdb_data
      roles: "{{ documentdb_postgres_role }}"
      login_user: "{{ postgres_admin }}"
      login_password: "{{ postgres_admin_password }}"
      login_host: "{{ postgres_host | default('localhost') }}"
      login_port: "{{ postgres_port | default(5432) }}"

  when:
    - _patroni_primary.json.role == "primary"
    - "'documentdb' in pg_extensions"
    - documentdb_postgres_role is defined and documentdb_postgres_role | length > 0
  tags: [primary]
